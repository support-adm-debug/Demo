<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080a">
<title>RedVault — Meu espaço</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08080a;--p:#101014;--p2:#18181d;--line:#2a2a31;--red:#e5092f;--red2:#ff2448;--txt:#f5f5f5;--mut:#92929b;--mine:#741024}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{height:100dvh;display:flex;overflow:hidden}.side{width:330px;background:#0d0d10;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand,.top{height:72px;padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.logo,.avatar{display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,var(--red2),#760018)}.logo{width:42px;height:42px;border-radius:13px;font-size:21px}.brand b{font-size:18px}.brand small,.top small{display:block;color:var(--mut);margin-top:3px}.search{padding:12px}.searchbox{height:42px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:8px}.searchbox input{width:100%;background:none;border:0;outline:0;color:#fff}.sidebuttons{display:flex;gap:8px;padding:0 12px 10px}.sidebuttons button,.icon,.attach{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:9px}.sidebuttons button{flex:1}.chats{overflow:auto;padding:0 8px}.chat{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;margin:3px 0}.chat.active{background:linear-gradient(90deg,#2b0c14,#171116)}.chat:hover{background:#17171b}.chatico{width:39px;height:39px;border-radius:11px;background:#231016;display:grid;place-items:center;color:#ff4160}.ct{min-width:0}.ct b,.ct span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct b{font-size:14px}.ct span{font-size:12px;color:var(--mut);margin-top:4px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{padding:0 18px;background:#0d0d10}.avatar{width:43px;height:43px;border-radius:50%}.topinfo{flex:1;min-width:0}.topinfo b{font-size:16px}.topinfo small{color:#707078}.email{font-size:10px;color:#666}.icon{width:40px;height:40px;padding:0}.msgs{flex:1;overflow:auto;padding:22px max(12px,calc((100vw - 900px)/2));background:radial-gradient(circle at 20% 10%,#e5092f08,transparent 30%),#09090b}.day{text-align:center;color:#777;font-size:11px;margin:3px 0 18px}.msg{display:flex;justify-content:flex-end;margin:8px 0}.bubble{max-width:min(680px,90%);padding:10px 12px 7px;background:linear-gradient(145deg,#8e102c,var(--mine));border:1px solid #92112d;border-radius:14px 14px 4px 14px}.text{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.meta{text-align:right;font-size:10px;color:#c7a5ac;margin-top:5px}.card{margin-top:8px;background:#101014;border:1px solid #34343b;border-radius:11px;overflow:hidden}.card img{width:100%;max-height:260px;object-fit:cover;display:block}.cardbody{padding:9px}.domain{color:#ff5b77;font-size:11px;font-weight:bold}.url{font-size:11px;color:#777;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.composerwrap{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0d0d10;border-top:1px solid var(--line)}.composer{max-width:900px;margin:auto;display:flex;gap:8px;align-items:flex-end}.textarea{flex:1;min-height:43px;max-height:140px;resize:none;background:#19191e;border:1px solid var(--line);border-radius:13px;color:#fff;padding:11px 13px;outline:0}.send{width:46px;height:43px;border-radius:12px;background:var(--red);font-weight:900;font-size:18px}.attach{width:43px;height:43px;padding:0}.empty{height:100%;display:grid;place-items:center;color:#777;text-align:center}.modalbg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{width:min(500px,100%);background:#121216;border:1px solid #303038;border-radius:16px;padding:18px}.modal h3{margin-top:0}.modal p{color:var(--mut);font-size:13px;line-height:1.5}.modal input{width:100%;margin:5px 0;padding:11px;border-radius:10px;background:#1a1a20;border:1px solid var(--line);color:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.actions button{padding:10px 14px;border-radius:10px;background:#202027}.danger{background:#8f0d29!important}.auth{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#300813,#08080a 55%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.auth.hidden{display:none}.authbox{width:min(410px,100%);background:#111116;border:1px solid #34343c;border-radius:20px;padding:25px;box-shadow:0 20px 70px #0009}.authbox input{width:100%;padding:12px;margin:5px 0;background:#1a1a20;border:1px solid #303038;border-radius:11px;color:#fff}.authbtn{width:100%;padding:12px;margin-top:8px;border-radius:11px;background:var(--red);font-weight:800}.switch{width:100%;margin-top:12px;background:none;color:#ff5570}.err{color:#ff6d86;font-size:12px;min-height:17px;margin-top:6px}.mobile{display:none}@media(max-width:720px){.side{position:absolute;z-index:10;inset:0 55px 0 0;transform:translateX(-105%);transition:.2s;box-shadow:20px 0 50px #0008}.side.open{transform:none}.mobile{display:block}.top{padding:0 10px}.msgs{padding-left:10px;padding-right:10px}}
</style></head>
<body>
<div class="auth" id="auth"><div class="authbox"><div class="logo">R</div><h1>RedVault</h1><p>Seu espaço pessoal independente do seu número de telefone. Suas anotações ficam na nuvem, associadas à sua conta.</p><input id="email" type="email" placeholder="Seu e-mail"><input id="pass" type="password" placeholder="Senha (mín. 6 caracteres)"><div class="err" id="autherr"></div><button class="authbtn" id="authbtn" onclick="authAction()">Entrar</button><button class="switch" id="switch" onclick="toggleMode()">Criar minha conta</button></div></div>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">R</div><div><b>RedVault</b><small>seu espaço pessoal</small></div></div><div class="search"><div class="searchbox">⌕ <input id="search" placeholder="Pesquisar mensagens..."></div></div><div class="sidebuttons"><button onclick="newChat()">＋ Nova</button><button onclick="pinned()">📌 Fixados</button></div><div class="chats" id="chats"></div></aside><main class="main"><header class="top"><button class="icon mobile" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="avatar">R</div><div class="topinfo"><b id="chatname">♡G૨ąĉe 𓂀</b><small id="status">conectando...</small><span class="email" id="ue"></span></div><button class="icon" onclick="document.getElementById('search').focus()">⌕</button><button class="icon" onclick="settings()">⋮</button></header><section class="msgs" id="msgs"></section><div class="composerwrap"><div class="composer"><button class="attach" onclick="document.getElementById('file').click()">📎</button><input hidden type="file" id="file" accept="image/*,.pdf,.txt,.doc,.docx,.zip,.mp4,.webm"><textarea class="textarea" id="input" rows="1" placeholder="Digite uma mensagem..."></textarea><button class="send" onclick="send()">➤</button></div></div></main></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<script>
/* CONFIGURE ESTES DOIS VALORES COM OS DADOS DO SEU PROJETO SUPABASE. Nunca use a secret/service_role key aqui. */
const SUPABASE_URL='https://jlryqzmoctojuzzlmrit.supabase.co';
const SUPABASE_KEY='sb_publishable_qv_j4mhcqBxRpgcDuwZwFA_r0SrNvMR';
const configured=!SUPABASE_URL.includes('COLE_AQUI')&&!SUPABASE_KEY.includes('COLE_AQUI');
let sb,user,chats=[],msgs=[],active,search='',signup=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function time(v){return new Date(v).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}function urls(t){return t.match(/https?:\/\/[^\s<]+/g)||[]}function yt(u){try{let x=new URL(u);if(x.hostname.includes('youtu.be'))return x.pathname.slice(1).split(/[/?#]/)[0];if(x.hostname.includes('youtube.com')){if(x.pathname==='/watch')return x.searchParams.get('v');if(x.pathname.startsWith('/shorts/'))return x.pathname.split('/')[2]}}catch{}return null}function domain(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return''}}function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a target="_blank" rel="noopener" href="$1" style="color:#ff5472">$1</a>')}
async function init(){if(!configured){$('autherr').textContent='Configure SUPABASE_URL e SUPABASE_KEY no código primeiro.';return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let {data:{session}}=await sb.auth.getSession();if(session)enter(session.user);sb.auth.onAuthStateChange((e,s)=>{if(s&&!user)enter(s.user);if(!s){user=null;$('auth').classList.remove('hidden')}})}
async function enter(u){user=u;$('auth').classList.add('hidden');$('ue').textContent=u.email||'';$('status').textContent='sincronizando na nuvem...';await loadChats();$('status').textContent='sincronizado na nuvem'}
async function loadChats(){let r=await sb.from('rv_chats').select('*').order('created_at');if(r.error)throw r.error;chats=r.data||[];if(!chats.length){r=await sb.from('rv_chats').insert({owner_id:user.id,name:'Meu espaço'}).select().single();if(r.error)throw r.error;chats=[r.data]}active=active&&chats.some(x=>x.id===active)?active:chats[0].id;$('chatname').textContent=chats.find(x=>x.id===active).name;await loadMsgs()}
async function loadMsgs(){let r=await sb.from('rv_messages').select('*').eq('chat_id',active).order('created_at');if(r.error)throw r.error;msgs=r.data||[];render()}
function renderChats(){$('chats').innerHTML=chats.map(c=>`<div class="chat ${c.id===active?'active':''}" onclick="selectChat('${c.id}')" oncontextmenu="chatMenu(event,'${c.id}')"><div class="chatico">💬</div><div class="ct"><b>${esc(c.name)}</b><span>${c.id===active?esc(msgs.at(-1)?.text||'Sem mensagens'):'Abrir conversa'}</span></div><button class="icon" onclick="event.stopPropagation();chatActions('${c.id}')" title="Opções" style="margin-left:auto;width:34px;height:34px;padding:0">⋮</button></div>`).join('')}
function render(){renderChats();let a=search.toLowerCase(),list=msgs.filter(m=>!a||(m.text||'').toLowerCase().includes(a)||(m.file_name||'').toLowerCase().includes(a));if(!list.length){$('msgs').innerHTML='<div class="empty"><div><b>Nada encontrado</b><br><small>Comece uma anotação.</small></div></div>';return}$('msgs').innerHTML='<div class="day">Dados vindos da nuvem</div>'+list.map(m=>messageHTML(m)).join('');$('msgs').scrollTop=$('msgs').scrollHeight}
function messageHTML(m){let body='';if(m.type==='image'&&m.file_url)body=`<div class="text">${esc(m.text||m.file_name)}</div><div class="card"><img src="${esc(m.file_url)}"></div>`;else if(m.type==='file')body=`<div class="text">${esc(m.text||'📎 Arquivo')}</div><a class="card" href="${esc(m.file_url||'#')}" target="_blank" style="display:block;text-decoration:none;color:#fff"><div class="cardbody"><b>📄 ${esc(m.file_name||'Arquivo')}</b><div class="url">Abrir arquivo</div></div></a>`;else{body=`<div class="text">${linkify(m.text||'')}</div>`;let u=urls(m.text||'')[0];if(u){let id=yt(u),im=id?`https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`:'';body+=`<div class="card">${im?`<a href="${esc(u)}" target="_blank"><img src="${im}" onerror="this.style.display='none'"></a>`:''}<div class="cardbody"><div class="domain">${esc(domain(u))}</div><div>${id?'YouTube / Shorts':'Link salvo'}</div><div class="url">${esc(u)}</div></div></div>`}}return `<div class="msg" oncontextmenu="menu(event,'${m.id}')"><div class="bubble">${m.pinned?'📌 ':''}${body}<div class="meta">${time(m.created_at)} ✓</div></div></div>`}
async function send(){let t=$('input').value.trim();if(!t)return;let r=await sb.from('rv_messages').insert({owner_id:user.id,chat_id:active,type:'text',text:t});if(r.error)return alert(r.error.message);$('input').value='';resize();await loadMsgs()}
async function selectChat(id){active=id;$('chatname').textContent=chats.find(x=>x.id===id).name;await loadMsgs();$('side').classList.remove('open')}
async function newChat(){open(`<h3>Nova conversa</h3><p>Crie um espaço separado.</p><input id="newname" placeholder="Ex.: Estudos, Ideias, Projetos"><div class="actions"><button onclick="closeM()">Cancelar</button><button class="danger" onclick="createChat()">Criar</button></div>`);setTimeout(()=>$('newname').focus(),30)}
async function createChat(){let name=$('newname').value.trim()||'Nova conversa',r=await sb.from('rv_chats').insert({owner_id:user.id,name}).select().single();if(r.error)return alert(r.error.message);chats.push(r.data);active=r.data.id;msgs=[];$('chatname').textContent=name;closeM();render()}
function menu(e,id){e.preventDefault();open(`<h3>Mensagem</h3><div class="actions" style="justify-content:flex-start;flex-wrap:wrap"><button onclick="pin('${id}')">📌 Fixar/desafixar</button><button class="danger" onclick="delMsg('${id}')">🗑 Excluir</button><button onclick="closeM()">Fechar</button></div>`);}function chatActions(id){const c=chats.find(x=>x.id===id);if(!c)return;open(`<h3>💬 ${esc(c.name)}</h3><p>O que deseja fazer com esta conversa?</p><div class="actions"><button onclick="closeM()">Cancelar</button><button class="danger" onclick="delChat('${id}')">🗑 Excluir conversa</button></div>`)}
function chatMenu(e,id){e.preventDefault();e.stopPropagation();chatActions(id)}
async function delChat(id){const c=chats.find(x=>x.id===id);if(!c)return;const q=await sb.from('rv_messages').select('*',{count:'exact',head:true}).eq('chat_id',id);if(q.error)return alert(q.error.message);const question=q.count>0?`A conversa "${c.name}" possui ${q.count} mensagem(ns). Excluir a conversa também apagará todas elas. Continuar?`:`Excluir a conversa "${c.name}"?`;closeM();if(!confirm(question))return;$('status').textContent='excluindo conversa...';const r=await sb.from('rv_chats').delete().eq('id',id);if(r.error){$('status').textContent='sincronizado na nuvem';return alert(r.error.message)}chats=chats.filter(x=>x.id!==id);if(!chats.length){const created=await sb.from('rv_chats').insert({owner_id:user.id,name:'Meu espaço'}).select().single();if(created.error){$('status').textContent='erro ao criar espaço';return alert(created.error.message)}chats=[created.data]}if(id===active)active=chats[0].id;$('chatname').textContent=chats.find(x=>x.id===active).name;await loadMsgs();$('status').textContent='sincronizado na nuvem'}
async function pin(id){let m=msgs.find(x=>x.id===id),r=await sb.from('rv_messages').update({pinned:!m.pinned}).eq('id',id);if(r.error)alert(r.error.message);else{closeM();loadMsgs()}}
async function delMsg(id){if(!confirm('Excluir esta mensagem da nuvem?'))return;let r=await sb.from('rv_messages').delete().eq('id',id);if(r.error)alert(r.error.message);else{closeM();loadMsgs()}}
function pinned(){let p=msgs.filter(x=>x.pinned);open('<h3>📌 Fixados</h3>'+(p.length?p.map(x=>`<p style="background:#1a1a20;padding:10px;border-radius:8px">${esc(x.text||x.file_name||'Arquivo')}</p>`).join(''):'<p>Nenhum fixado.</p>')+'<div class="actions"><button onclick="closeM()">Fechar</button></div>')}
async function upload(f){if(f.size>25*1024*1024)return alert('Limite: 25 MB por arquivo.');let ext=f.name.includes('.')?f.name.split('.').pop():'bin',path=`${user.id}/${crypto.randomUUID()}.${ext}`;$('status').textContent='enviando arquivo...';let r=await sb.storage.from('redvault-files').upload(path,f);if(r.error){$('status').textContent='sincronizado na nuvem';return alert(r.error.message)}let u=sb.storage.from('redvault-files').getPublicUrl(path).data.publicUrl;let type=f.type.startsWith('image/')?'image':'file';r=await sb.from('rv_messages').insert({owner_id:user.id,chat_id:active,type,text:type==='image'?'📷 '+f.name:'📎 '+f.name,file_name:f.name,file_size:f.size,file_path:path,file_url:u});if(r.error)alert(r.error.message);await loadMsgs();$('status').textContent='sincronizado na nuvem'}
$('file').onchange=async function(){if(this.files[0])await upload(this.files[0]);this.value=''};let chatLongPress;$('chats').addEventListener('touchstart',e=>{const item=e.target.closest('.chat');if(!item)return;const m=(item.getAttribute('onclick')||'').match(/selectChat\('([^']+)'\)/);if(!m)return;clearTimeout(chatLongPress);chatLongPress=setTimeout(()=>chatActions(m[1]),650)},{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>$('chats').addEventListener(ev,()=>clearTimeout(chatLongPress),{passive:true}));$('search').oninput=e=>{search=e.target.value;render()};$('input').oninput=resize;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};function resize(){let e=$('input');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,140)+'px'}
function open(h){$('modal').innerHTML=h;$('modalbg').style.display='flex'}function closeM(){$('modalbg').style.display='none'}function settings(){open(`<h3>⚙️ Conta</h3><p>Logado como <b>${esc(user?.email||'')}</b>.</p><p>As mensagens ficam no banco externo. Limpar os dados do Chrome pode remover a sessão local, mas não apaga os registros do banco. Basta entrar novamente.</p><div class="actions"><button onclick="closeM()">Fechar</button><button class="danger" onclick="logout()">Sair</button></div>`)}async function logout(){await sb.auth.signOut();closeM()}
async function authAction(){let e=$('email').value.trim(),p=$('pass').value;if(!e||p.length<6)return $('autherr').textContent='Informe um e-mail e uma senha de pelo menos 6 caracteres.';let r=signup?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});$('autherr').textContent=r.error?r.error.message:(signup?'Conta criada. Confira seu e-mail se a confirmação estiver ativada.':'')}
function toggleMode(){signup=!signup;$('authbtn').textContent=signup?'Criar conta':'Entrar';$('switch').textContent=signup?'Já tenho uma conta':'Criar minha conta';$('autherr').textContent=''}
if(configured)init();else $('autherr').textContent='Primeiro configure SUPABASE_URL e SUPABASE_KEY no código.';
</script></body></html>
